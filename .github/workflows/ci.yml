name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test scripts/*.test.ts

      - name: Run workspace audit
        run: bun scripts/audit.ts

      - name: Verify skills
        run: bun scripts/verify-skills.ts

      - name: Verify agent sync
        run: bun scripts/agent-verify.ts
